kind = "mobile"
previewPath = "/"
title = "Smart Attendance"
description = "A professional mobile attendance and leave management app for employees and admins, with camera-based check-in, GPS confirmation, history, leave workflows, and workforce oversight."
version = "1.0.0"
id = "artifacts/smart-attendance"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19583

[services.development]
run = "pnpm --filter @workspace/smart-attendance run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-attendance", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/smart-attendance", "run", "serve" ]

[services.env]
PORT = "19583"
BASE_PATH = "/"
